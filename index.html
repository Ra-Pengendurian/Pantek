<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love 3D 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at center, #1a0030 0%, #000 100%);
    overflow: hidden;
    height: 100vh;
    font-family: sans-serif;
  }
  canvas { display: block; }
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff69b4;
    font-size: 12px;
    opacity: 0.6;
    pointer-events: none;
    letter-spacing: 2px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
<div class="hint">MADE WITH 💖</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====== SETUP SCENE ======
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 35;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ====== HEART SHAPE (Parametric 3D) ======
function heartPoint(u, v) {
  // u: 0..2pi (around), v: -1..1 (depth)
  const x = 16 * Math.pow(Math.sin(u), 3);
  const y = 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u);
  const z = v * (1 - Math.abs(x) / 20) * 4; // 3D depth
  
  // Bentuk lebih bulat 3D
  const zScale = Math.sqrt(Math.max(0, 1 - Math.pow(Math.abs(x) / 18, 2)));
  const z3 = v * zScale * 6;

  return { x: x * 0.9, y: y * 0.9, z: z3 };
}

// ====== BUILD HEART MESH DARI PARTICLES ======
const heartGroup = new THREE.Group();
scene.add(heartGroup);

// Layer 1: Surface particles
const surfaceCount = 4000;
const surfaceGeo = new THREE.BufferGeometry();
const surfacePositions = new Float32Array(surfaceCount * 3);
const surfaceColors = new Float32Array(surfaceCount * 3);

for (let i = 0; i < surfaceCount; i++) {
  const u = Math.random() * Math.PI * 2;
  const v = (Math.random() * 2 - 1);
  // Bias v ke permukaan
  const vSurf = v > 0 ? 1 : -1;
  const p = heartPoint(u, vSurf * (0.6 + Math.random() * 0.4));
  
  // Jitter sedikit
  surfacePositions[i * 3] = p.x + (Math.random() - 0.5) * 0.4;
  surfacePositions[i * 3 + 1] = p.y + (Math.random() - 0.5) * 0.4;
  surfacePositions[i * 3 + 2] = p.z + (Math.random() - 0.5) * 0.4;
  
  // Warna: pink ke merah
  const t = Math.random();
  surfaceColors[i * 3] = 1;
  surfaceColors[i * 3 + 1] = 0.1 + t * 0.4;
  surfaceColors[i * 3 + 2] = 0.4 + t * 0.3;
}

surfaceGeo.setAttribute('position', new THREE.BufferAttribute(surfacePositions, 3));
surfaceGeo.setAttribute('color', new THREE.BufferAttribute(surfaceColors, 3));

const surfaceMat = new THREE.PointsMaterial({
  size: 0.15,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const surfacePoints = new THREE.Points(surfaceGeo, surfaceMat);
heartGroup.add(surfacePoints);

// Layer 2: Inner glow particles
const glowCount = 1500;
const glowGeo = new THREE.BufferGeometry();
const glowPositions = new Float32Array(glowCount * 3);

for (let i = 0; i < glowCount; i++) {
  const u = Math.random() * Math.PI * 2;
  const v = (Math.random() * 2 - 1) * 0.5;
  const p = heartPoint(u, v);
  
  glowPositions[i * 3] = p.x;
  glowPositions[i * 3 + 1] = p.y;
  glowPositions[i * 3 + 2] = p.z;
}

glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));

const glowMat = new THREE.PointsMaterial({
  size: 0.3,
  color: 0xff1493,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const glowPoints = new THREE.Points(glowGeo, glowMat);
heartGroup.add(glowPoints);

// Layer 3: Floating particles (background love)
const bgCount = 800;
const bgGeo = new THREE.BufferGeometry();
const bgPositions = new Float32Array(bgCount * 3);
const bgVelocities = [];

for (let i = 0; i < bgCount; i++) {
  bgPositions[i * 3] = (Math.random() - 0.5) * 120;
  bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
  bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 60 - 20;
  bgVelocities.push({
    x: (Math.random() - 0.5) * 0.02,
    y: Math.random() * 0.03 + 0.01,
    z: (Math.random() - 0.5) * 0.02,
  });
}

bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));

const bgMat = new THREE.PointsMaterial({
  size: 0.2,
  color: 0xff69b4,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const bgPoints = new THREE.Points(bgGeo, bgMat);
scene.add(bgPoints);

// ====== LIGHT (buat efek glow) ======
const ambientLight = new THREE.AmbientLight(0xff69b4, 0.5);
scene.add(ambientLight);

// ====== MOUSE INTERACTION ======
let mouseX = 0;
let mouseY = 0;
let targetRotX = 0;
let targetRotY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
  targetRotY = mouseX * 0.8;
  targetRotX = mouseY * 0.5;
});

window.addEventListener('touchmove', (e) => {
  if (e.touches[0]) {
    mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouseY = (e.touches[0].clientY / window.innerHeight) * 2 - 1;
    targetRotY = mouseX * 0.8;
    targetRotX = mouseY * 0.5;
  }
});

// ====== ANIMATION LOOP ======
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Putar heart
  heartGroup.rotation.y += 0.01;
  
  // Smooth mouse follow
  heartGroup.rotation.x += (targetRotX - heartGroup.rotation.x) * 0.05;
  heartGroup.rotation.y += (targetRotY - heartGroup.rotation.y + heartGroup.rotation.y * 0.01) * 0.02;

  // Efek pulse (jantung berdetak)
  const pulse = 1 + Math.sin(time * 3) * 0.05;
  heartGroup.scale.set(pulse, pulse, pulse);

  // Efek glow berdenyut
  glowMat.opacity = 0.2 + Math.sin(time * 3) * 0.15;
  glowMat.size = 0.3 + Math.sin(time * 3) * 0.1;

  // Floating particles naik
  const positions = bgGeo.attributes.position.array;
  for (let i = 0; i < bgCount; i++) {
    positions[i * 3] += bgVelocities[i].x;
    positions[i * 3 + 1] += bgVelocities[i].y;
    positions[i * 3 + 2] += bgVelocities[i].z;
    
    // Reset kalo keluar
    if (positions[i * 3 + 1] > 40) {
      positions[i * 3 + 1] = -40;
      positions[i * 3] = (Math.random() - 0.5) * 120;
    }
  }
  bgGeo.attributes.position.needsUpdate = true;

  // Rotasi background
  bgPoints.rotation.y += 0.001;

  renderer.render(scene, camera);
}

animate();

// ====== RESPONSIVE ======
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
